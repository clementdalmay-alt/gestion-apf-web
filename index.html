<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FAF7F2">
<meta name="robots" content="noindex">
<title>Resident Activités</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;700&text=0123456789&display=swap">
<script src="https://accounts.google.com/gsi/client" async></script>
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}img{max-width:100%}[hidden]{display:none!important}
/* Resident Activités — charte de la bible (douce et lisible : fond clair, vert sauge, terracotta).
   Mise en page : une colonne, en-tête 56 px, contenu sans défilement, barre d'onglets 64 px.
   Les teintes marquées « ajusté » sont assombries pour atteindre un contraste de 4,5. */
:root {
  --fond: #FAF7F2;
  --surface: #FFFFFF;
  --texte: #2B2B2B;
  --texte-2: #5E625F;
  --sauge: #557560;          /* ajusté (bible : #5E7F67) */
  --sur-sauge: #FFFFFF;
  --terracotta: #A9573A;     /* ajusté (bible : #B5603C) */
  --rouge: #B23A3A;
  --bleu: #3D6E9E;
  --orange: #9A5B00;
  --bordure: #E4DED4;
  --sauge-fond: #E8EFE9;
  --rouge-fond: #F8E6E4;
  /* Graphique : paire validée (CVD, vision normale, contraste) ; distincte de la charte, réservée aux barres. */
  --g-avance: #D07A3E;
  --g-rembourse: #1A7F5E;
  --g-grille: #ECE7DF;
  --bleu-fond: #E4EDF6;
  --ombre: 0 1px 2px rgba(43, 43, 43, .06);
  /* Chiffres en Source Sans 3 (zéro sans barre, chargée pour les chiffres seuls), lettres en Atkinson Hyperlegible. */
  --police: "Source Sans 3", "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  --t-courant: 17px;
  --t-titre: 22px;
  --t-total: 28px;
  --rayon: 12px;
  --ecart: 12px;
  --h-bouton: 52px;
  --h-titre-box: 48px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --fond: #1F2321; --surface: #2A2F2C; --texte: #EDEAE4; --texte-2: #B5B8B4;
    --sauge: #8FB59A; --sur-sauge: #14201A; --terracotta: #E39A78; --rouge: #EE9A93; --bleu: #93B9DF; --orange: #E8B25E;
    --bordure: #3A403C; --sauge-fond: #2F3B33; --rouge-fond: #3D2A28; --bleu-fond: #26313C; --g-avance: #CC7536; --g-rembourse: #20A080; --g-grille: #343A36;
    --ombre: none; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --fond: #1F2321; --surface: #2A2F2C; --texte: #EDEAE4; --texte-2: #B5B8B4;
  --sauge: #8FB59A; --sur-sauge: #14201A; --terracotta: #E39A78; --rouge: #EE9A93; --bleu: #93B9DF; --orange: #E8B25E;
  --bordure: #3A403C; --sauge-fond: #2F3B33; --rouge-fond: #3D2A28; --bleu-fond: #26313C; --g-avance: #CC7536; --g-rembourse: #20A080; --g-grille: #343A36;
  --ombre: none; color-scheme: dark;
}

html, body { height: 100%; }
body {
  background: var(--fond); color: var(--texte);
  font-family: var(--police); font-size: var(--t-courant); line-height: 1.3;
  -webkit-text-size-adjust: 100%; overflow: hidden;
}
* { box-sizing: border-box; }
button, input, select, textarea { font: inherit; color: inherit; }
.num { font-variant-numeric: tabular-nums; white-space: nowrap; }

#app {
  height: 100%; max-width: 560px; margin: 0 auto;
  display: flex; flex-direction: column; position: relative;
}

/* En-tête */
.entete {
  flex: 0 0 56px; display: flex; align-items: center; gap: 8px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  border-bottom: 1px solid var(--bordure); background: var(--fond);
}
.entete h1 { font-size: var(--t-titre); margin: 0; font-weight: 700; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.puce { display: inline-flex; align-items: center; gap: 4px; padding: 2px 10px; border-radius: 999px; font-size: var(--t-courant); line-height: 28px; white-space: nowrap; border: 1px solid currentColor; }
.puce.test { color: var(--bleu); background: var(--bleu-fond); }
.puce.lecture { color: var(--texte-2); }
.version { color: var(--texte-2); white-space: nowrap; }

/* Zone de contenu : jamais de défilement, découpée en pages */
.contenu {
  flex: 1 1 auto; min-height: 0; overflow: hidden;
  display: flex; flex-direction: column; gap: var(--ecart);
  padding-block: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.pousse { flex: 1 1 auto; }

/* Box */
.box { background: var(--surface); border: 1px solid var(--bordure); border-radius: var(--rayon); box-shadow: var(--ombre); padding: 0 12px; }
.box-titre { height: var(--h-titre-box); display: flex; align-items: center; gap: 8px; font-weight: 700; }
.box-titre .fin { margin-left: auto; font-weight: 400; color: var(--texte-2); display: flex; align-items: center; gap: 4px; }
.ligne { min-height: 44px; display: flex; align-items: center; gap: 8px; border-top: 1px solid var(--bordure); }
.box > .ligne:first-child { border-top: 0; }
.ligne .lib { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ligne .sec { color: var(--texte-2); }
.total { font-size: var(--t-total); font-weight: 700; }
.avance { color: var(--terracotta); }
.rembourse { color: var(--sauge); }
.du { color: var(--rouge); }
.info { color: var(--bleu); }
.retard { color: var(--rouge); display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
.etat-vide { text-align: center; color: var(--texte-2); padding: 16px 8px; }
.etat-vide strong { display: block; color: var(--texte); font-size: var(--t-titre); margin-bottom: 6px; }

/* Boutons : 4 familles, 52 px */
.btn {
  min-height: var(--h-bouton); border-radius: var(--rayon); padding: 0 16px;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  font-weight: 700; cursor: pointer; border: 2px solid var(--sauge); background: transparent; color: var(--sauge);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 44px;
}
.btn.principal { background: var(--sauge); color: var(--sur-sauge); }
.btn.danger { border-color: var(--rouge); color: var(--rouge); }
.btn[disabled] { opacity: .45; cursor: default; }
.btn.icone { padding: 0; width: var(--h-bouton); flex: 0 0 var(--h-bouton); }
.actions {
  flex: 0 0 auto; display: flex; gap: var(--ecart); padding-block: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  border-top: 1px solid var(--bordure); background: var(--fond);
}
.actions .btn { flex: 1 1 0; min-width: 0; }
.actions .btn.icone { flex: 0 0 var(--h-bouton); }

/* Cartes de choix */
.grille { display: grid; grid-template-columns: 1fr 1fr; gap: var(--ecart); }
.carte {
  min-height: var(--h-bouton); border-radius: var(--rayon); border: 1px solid var(--bordure); background: var(--surface);
  text-align: left; padding: 6px 12px; cursor: pointer; display: flex; flex-direction: column; justify-content: center; min-width: 0;
}
/* Nom sur deux lignes au plus ; sous-titre sur une ligne. */
.carte b { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; line-clamp: 2; overflow: hidden; overflow-wrap: anywhere; line-height: 1.2; }
.carte span { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.carte span { color: var(--texte-2); }
@media (max-width: 359px) { .grille { grid-template-columns: 1fr; } }

/* Sélecteur segmenté */
.segments { display: flex; border: 2px solid var(--sauge); border-radius: var(--rayon); overflow: hidden; min-height: var(--h-bouton); }
.segments button { flex: 1 1 0; min-width: 0; border: 0; background: transparent; color: var(--sauge); font-weight: 700; cursor: pointer; padding: 0 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.segments button[aria-pressed="true"] { background: var(--sauge); color: var(--sur-sauge); }

/* Lignes cliquables */
.rangee { width: 100%; min-height: 52px; display: flex; align-items: center; gap: 8px; background: transparent; border: 0; border-top: 1px solid var(--bordure); padding: 0; text-align: left; cursor: pointer; }
.box > .rangee:first-child, .box-titre + .rangee { border-top: 0; }
.rangee .lib { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rangee .sec { color: var(--texte-2); }

/* Champs */
.champ { min-height: var(--h-bouton); display: flex; align-items: center; gap: 12px; border-top: 1px solid var(--bordure); }
.box > .champ:first-child { border-top: 0; }
.champ label { flex: 0 0 auto; min-width: 96px; font-weight: 700; }
.champ input, .champ select {
  flex: 1 1 auto; min-width: 0; height: 44px; border: 1px solid var(--bordure); border-radius: 8px; padding: 0 10px;
  background: var(--fond); text-align: right;
}
.champ input[type="text"]:not(.montant) { text-align: left; }
.champ input:focus, .champ select:focus { outline: 2px solid var(--sauge); outline-offset: 1px; }
.recherche { display: flex; gap: var(--ecart); align-items: center; }
.recherche input { flex: 1; min-width: 0; height: var(--h-bouton); border: 1px solid var(--bordure); border-radius: var(--rayon); padding: 0 12px; background: var(--surface); }
.recherche input:focus { outline: 2px solid var(--sauge); outline-offset: 1px; }
/* Interrupteur : zone tactile 56 × 44, piste dessinée de 52 × 32. */
.bascule { width: 56px; height: 44px; border: 0; background: transparent; position: relative; cursor: pointer; flex: 0 0 56px; margin-left: auto; padding: 0; }
.bascule::before { content: ""; position: absolute; top: 6px; left: 2px; width: 52px; height: 32px; border-radius: 16px; border: 2px solid var(--sauge); box-sizing: border-box; }
.bascule::after { content: ""; position: absolute; top: 11px; left: 7px; width: 22px; height: 22px; border-radius: 50%; background: var(--sauge); transition: left .15s; }
.bascule[aria-checked="true"]::before { background: var(--sauge); }
.bascule[aria-checked="true"]::after { left: 27px; background: var(--sur-sauge); }
.bascule-zone { min-width: 52px; min-height: 44px; display: flex; align-items: center; justify-content: flex-end; flex: 1; }

.message { border-radius: var(--rayon); padding: 10px 12px; display: flex; gap: 8px; align-items: flex-start; }
.message.erreur { background: var(--rouge-fond); color: var(--rouge); }
.message.avert { background: var(--rouge-fond); color: var(--orange); }
.message.info { background: var(--bleu-fond); color: var(--bleu); }
.aide { color: var(--texte-2); }

/* Pagination */
.pager { display: flex; align-items: center; gap: 4px; }
.pager button { width: 44px; height: 44px; border: 0; background: transparent; color: var(--sauge); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; border-radius: 8px; }
.pager button[disabled] { opacity: .35; cursor: default; }

/* Tableau des totaux */
.tableau .ligne { display: grid; grid-template-columns: minmax(0, 1fr) 76px 76px 76px; gap: 6px; }
.tableau.trois .ligne { grid-template-columns: minmax(0, 1fr) 92px 92px; }
.tableau .ligne > * { text-align: right; }
.tableau .ligne > :first-child { text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tableau .entete-t { color: var(--texte-2); font-weight: 700; }
.tableau .pied { font-weight: 700; }

/* Barre d'onglets */
.onglets {
  flex: 0 0 auto; display: flex; border-top: 1px solid var(--bordure); background: var(--surface);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px);
}
.onglets button { flex: 1 1 0; min-width: 0; height: 64px; border: 0; background: transparent; color: var(--texte-2); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; cursor: pointer; font-size: var(--t-courant); }
.onglets button span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; padding: 0 2px; }
.onglets button[aria-current="page"] { color: var(--sauge); font-weight: 700; }

svg.ic { width: 24px; height: 24px; flex: 0 0 24px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* Notification (en haut, fermable) et bandeau Annuler (en bas) */
.notif {
  position: absolute; left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); top: 64px; z-index: 5;
  border-radius: var(--rayon); padding: 10px 12px; min-height: 44px; display: flex; align-items: center; gap: 8px;
  background: var(--surface); border: 1px solid var(--bordure); box-shadow: 0 4px 16px rgba(0, 0, 0, .12); cursor: pointer; text-align: left; width: auto;
}
.notif.ok { color: var(--sauge); }
.notif.erreur { color: var(--rouge); }
.notif.info { color: var(--bleu); }
.bandeau {
  position: absolute; left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); bottom: 88px; z-index: 6;
  border-radius: var(--rayon); padding: 4px 4px 4px 12px; display: flex; align-items: center; gap: 8px;
  background: var(--texte); color: var(--fond);
}
.bandeau .lib { flex: 1; min-width: 0; }
.bandeau .btn { border-color: var(--fond); color: var(--fond); }

:focus-visible { outline: 3px solid var(--bleu); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* Liste des activités et titres qui peuvent porter un nom long. */
.lib-souple { flex: 1; min-width: 0; overflow-wrap: anywhere; padding-block: 6px; }
.titre-souple { min-width: 0; overflow-wrap: anywhere; line-height: 1.2; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; line-clamp: 2; overflow: hidden; }
/* Bouton ⓘ des totaux, à côté du mot « Total », zone tactile 44 px. */
.tableau .ligne > .total-aide { display: flex; align-items: center; gap: 2px; }
.pastille-info { width: 44px; height: 44px; flex: 0 0 44px; border: 0; background: transparent; color: var(--bleu); display: inline-flex; align-items: center; justify-content: center; cursor: pointer; border-radius: 8px; margin-block: -2px; }

/* Graphique des totaux */
.legende { display: flex; gap: 16px; min-height: 32px; align-items: center; color: var(--texte-2); }
.legende span { display: inline-flex; align-items: center; gap: 6px; }
.pastille { width: 14px; height: 14px; border-radius: 4px; display: inline-block; }
i.g-avance { background: var(--g-avance); }
i.g-rembourse { background: var(--g-rembourse); }
.g-colonnes { position: relative; height: 212px; margin: 12px 0 4px 48px; display: flex; align-items: stretch; padding-bottom: 28px; }
.g-grille { position: absolute; left: -48px; right: 0; border-top: 1px solid var(--g-grille); pointer-events: none; }
/* Repères sur la zone des barres (hauteur totale moins les 28 px des libellés). */
.g-grille.g-haut { bottom: 100%; }
.g-grille.g-milieu { bottom: calc(14px + 50%); }
.g-grille.g-zero { bottom: 28px; }
.tableau .ligne.g-detail { display: flex; align-items: center; }
.g-grille b { position: absolute; left: 0; top: 4px; font-weight: 400; color: var(--texte-2); font-size: var(--t-courant); line-height: 1; }
.g-zero { border-top-color: var(--bordure); }
.g-col { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; align-items: center; cursor: pointer; position: relative; border-radius: 6px; }
.g-col.choisi { background: var(--sauge-fond); }
.g-barres { flex: 1; width: 100%; display: flex; align-items: flex-end; justify-content: center; gap: 2px; }
.g-barres i { width: min(10px, 32%); border-radius: 4px 4px 0 0; display: block; }
.g-lib { position: absolute; bottom: -28px; height: 28px; line-height: 28px; color: var(--texte-2); white-space: nowrap; }
.g-col.choisi .g-lib { color: var(--texte); font-weight: 700; }
.g-lignes { display: flex; flex-direction: column; gap: 4px; padding-block: 8px; }
.g-ligne { display: grid; grid-template-columns: 112px minmax(0, 1fr); align-items: center; gap: 8px; min-height: 40px; cursor: pointer; border-radius: 6px; padding: 0 4px; }
.g-ligne.choisi { background: var(--sauge-fond); }
.g-nom { color: var(--texte-2); overflow-wrap: anywhere; line-height: 1.15; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; line-clamp: 2; overflow: hidden; }
.g-ligne.choisi .g-nom { color: var(--texte); font-weight: 700; }
.g-pistes { display: flex; flex-direction: column; gap: 2px; }
.g-pistes i { display: block; height: 10px; border-radius: 0 4px 4px 0; min-width: 0; }
.g-detail { gap: 10px; }
.g-detail .g-nom-detail { flex: 1; min-width: 0; font-weight: 700; overflow-wrap: anywhere; line-height: 1.15; }
.g-detail .num { flex: 0 0 auto; }
.g-detail { min-height: 48px; }
.g-detail .pastille-info { margin-block: 0; }

/* Numéro de version : bouton discret (double tap = codes de test), zone tactile 44 px. */
.entete button.version { background: transparent; border: 0; color: var(--texte-2); min-width: 44px; min-height: 44px; padding: 0 4px; cursor: pointer; touch-action: manipulation; font: inherit; }

/* Boutons du bas de l'accueil : deux côte à côte, marge intérieure réduite pour que « + Remboursement » tienne. */
.btn.serre { padding: 0 5px; gap: 2px; }

/* Bouton Aide (?) de l'en-tête */
.aide-btn { width: 44px; height: 44px; flex: 0 0 44px; border: 0; background: transparent; color: var(--sauge); display: inline-flex; align-items: center; justify-content: center; cursor: pointer; border-radius: 8px; }
/* Tutoriel : voile, anneau sur la cible, bulle */
.tuto { position: absolute; inset: 0; z-index: 20; }
.tuto-anneau { position: absolute; border-radius: var(--rayon); box-shadow: 0 0 0 9999px rgba(20, 24, 22, .62); outline: 3px solid var(--fond); pointer-events: none; transition: all .2s; }
.tuto-anneau.tuto-plein { left: 50%; top: 50%; width: 0; height: 0; outline: 0; }
.tuto-bulle { position: absolute; left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); background: var(--surface); color: var(--texte); border-radius: var(--rayon); padding: 12px; box-shadow: 0 8px 28px rgba(0, 0, 0, .3); display: flex; flex-direction: column; gap: 8px; }
.tuto-etape { display: flex; justify-content: space-between; color: var(--texte-2); }
.tuto-titre { margin: 0; font-size: var(--t-titre); font-weight: 700; line-height: 1.2; }
.tuto-texte { margin: 0; line-height: 1.35; }
.tuto-actions { display: flex; gap: var(--ecart); }
.tuto-actions .btn:not(.icone) { flex: 1 1 0; min-width: 0; }
.tuto-actions .btn.icone { flex: 0 0 var(--h-bouton); }
@media (prefers-reduced-motion: reduce) { .tuto-anneau { transition: none; } }

/* Choix de l'année sur l'accueil */
.choix-annee { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; min-width: 0; }
.choix-annee select { height: 44px; border: 1px solid var(--bordure); border-radius: 8px; padding: 0 6px; background: var(--fond); font-weight: 700; font-variant-numeric: tabular-nums; }
.choix-annee select:focus { outline: 2px solid var(--sauge); outline-offset: 1px; }
/* Écran Télécharger : un contenu par ligne, boutons PDF / Excel à droite */
.ligne.tele { padding-block: 4px; }
.tele-btns { display: flex; gap: 6px; flex: 0 0 auto; }
.tele-btns .btn { min-width: 56px; min-height: 44px; }
/* Sauvegarde : le champ fichier couvre le bouton (le sélecteur du téléphone s'ouvre au toucher) */
.btn.fichier { position: relative; cursor: pointer; border-width: 0; box-shadow: inset 0 0 0 2px var(--sauge); }
.btn.fichier input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; font-size: 0; }
.btn.fichier:focus-within { outline: 2px solid var(--sauge); outline-offset: 2px; }
.btn.fichier:has(input[disabled]) { opacity: .45; cursor: default; }

/* Appli Google : compléments à la charte (src/styles.css). */
.connexion { display: flex; flex-direction: column; gap: var(--ecart); align-items: stretch; }
.connexion .bouton-google { min-height: 52px; display: flex; justify-content: center; align-items: center; }
.puce.role { color: var(--sauge); }
.champ textarea { flex: 1 1 auto; min-width: 0; min-height: 64px; border: 1px solid var(--bordure); border-radius: 8px; padding: 8px 10px; background: var(--fond); resize: none; font: inherit; color: inherit; }
.champ textarea:focus { outline: 2px solid var(--sauge); outline-offset: 1px; }
.champ.haut { align-items: flex-start; padding-block: 6px; }
.statut { display: inline-flex; align-items: center; gap: 4px; padding: 0 8px; border-radius: 999px; line-height: 26px; white-space: nowrap; border: 1px solid currentColor; }
.statut.a_repartir { color: var(--orange); }
.statut.repartie { color: var(--sauge); }
.ligne-depense { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 8px; padding-block: 8px; border-top: 1px solid var(--bordure); }
.box > .ligne-depense:first-of-type, .box-titre + .ligne-depense { border-top: 0; }
.ligne-depense .lib { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 700; }
.ligne-depense .sous { grid-column: 1 / -1; color: var(--texte-2); overflow-wrap: anywhere; }
.compteur { font-size: var(--t-total); font-weight: 700; }
.statut.envoi { color: var(--texte-2); border-style: dashed; }
/* G2 : lignes cliquables, répartition. */
button.ligne-depense { width: 100%; background: transparent; border: 0; border-top: 1px solid var(--bordure); text-align: left; cursor: pointer; color: inherit; font: inherit; }
.box > button.ligne-depense:first-of-type, .box-titre + button.ligne-depense { border-top: 0; }
.compteur-petit { font-weight: 700; font-size: var(--t-titre); }
.ligne-part { min-height: 52px; display: flex; align-items: center; gap: 8px; border-top: 1px solid var(--bordure); }
.box > .ligne-part:first-child { border-top: 0; }
.ligne-part .choix { flex: 1 1 auto; min-width: 0; min-height: 52px; display: flex; align-items: center; gap: 10px; background: transparent; border: 0; padding: 0; text-align: left; cursor: pointer; color: inherit; font: inherit; }
.ligne-part .choix .lib { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ligne-part .choix .sec { color: var(--texte-2); }
.ligne-part .choix[aria-pressed="true"] svg.ic { color: var(--sauge); }
.ligne-part input.part { flex: 0 0 104px; width: 104px; height: 44px; border: 1px solid var(--bordure); border-radius: 8px; padding: 0 10px; background: var(--fond); text-align: right; }
.ligne-part input.part:focus { outline: 2px solid var(--sauge); outline-offset: 1px; }
.btn[aria-pressed="true"] { background: var(--sauge); color: var(--sur-sauge); }
.ligne .fin { margin-left: auto; display: flex; align-items: center; }
.champ input:disabled { opacity: .55; cursor: not-allowed; }
.rangee.membre { min-height: 60px; }
.rangee.membre .lib-souple { min-width: 0; }
.puce.role.asso { color: var(--bleu); }
.champ input[readonly] { opacity: .7; }
.onglets.cinq button { font-size: 13px; padding: 0; }
.onglets.cinq button span { padding: 0; }
.aide a { color: var(--sauge); }
.entete .aide-btn { margin-left: -4px; }
/* Logo de l'établissement (couleur en clair, blanc en sombre). */
.logo { display: inline-flex; flex: 0 0 auto; }
.logo img { display: block; height: 100%; width: auto; }
.logo .logo-sombre { display: none; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .logo .logo-clair { display: none; } :root:not([data-theme="light"]) .logo .logo-sombre { display: block; } }
:root[data-theme="dark"] .logo .logo-clair { display: none; }
:root[data-theme="dark"] .logo .logo-sombre { display: block; }
.logo-entete { height: 34px; margin-right: 2px; }
.logo-connexion { height: 104px; align-self: center; margin-block: 8px 4px; }
/* Titre de l'en-tête : taille calculée sur la largeur de l'écran pour tenir sur une ligne (logo, « ? », compte). */
.entete h1 { font-size: clamp(15px, calc((100vw - 200px) / 9.6), 22px); letter-spacing: -0.01em; }

  function classeurExport(X) {
    var e = S.donnees, c = calc(), deps = idx(e.depenses), res = idx(e.residents), parts = idx(e.parts);
    function j(d) { return d ? new Date(+d.slice(0, 4), +d.slice(5, 7) - 1, +d.slice(8, 10)) : ''; }
    function eu(m) { return Math.round(m) / 100; }
    function col(k) { return t('g.export.col.' + k); }
    var feuilles = [
      ['g.export.onglet.residents', [col('resident'), col('chambre'), col('avance_annee'), col('rembourse_annee'), col('reste_du'), col('retard')],
        e.residents.slice().sort(L.comparerNoms).map(function (r) { var x = c.parResident[r.id] || { avance: 0, rembourse: 0, resteDu: 0, retards: [] }; return [r.nom, r.chambre || '', eu(x.avance), eu(x.rembourse), eu(x.resteDu), x.retards.length ? t('commun.retard') : '']; })],
      ['g.export.onglet.depenses', [col('date'), col('activite'), col('montant'), col('statut'), col('saisi_par'), col('note')],
        triees(e.depenses).map(function (d) { return [j(d.date), nomActivite(d.activiteId), eu(d.montant), t('g.statut.' + L.statutDepense(e, d.id)), auteur(d.creePar), d.commentaire || '']; })],
      ['g.export.onglet.parts', [col('date'), col('activite'), col('resident'), col('chambre'), col('montant'), col('rembourse'), col('reste')],
        (e.parts || []).filter(function (p) { return deps[p.depenseId]; }).sort(function (a, b) { return deps[a.depenseId].date < deps[b.depenseId].date ? 1 : -1; }).map(function (p) {
          var d = deps[p.depenseId], st = c.avances[p.id] || { rembourse: 0, reste: p.montant }, r = res[p.residentId] || {};
          return [j(d.date), nomActivite(d.activiteId), r.nom || '', r.chambre || '', eu(p.montant), eu(st.rembourse), eu(st.reste)]; })],
      ['g.export.onglet.remboursements', [col('date'), col('resident'), col('montant'), col('sur'), col('saisi_par')],
        (e.remboursements || []).slice().sort(function (a, b) { return a.date < b.date ? 1 : -1; }).map(function (b) {
          var p = b.partId ? parts[b.partId] : null, d = p ? deps[p.depenseId] : null;
          return [j(b.date), nomResident(b.residentId), eu(b.montant), d ? t('g.fiche.part', { activite: nomActivite(d.activiteId), date: date(d.date) }) : t('detail.libre'), auteur(b.creePar)]; })]
    ];
    var wb = X.utils.book_new();
    feuilles.forEach(function (fe) {
      var aoa = [fe[1]].concat(fe[2]);
      var ws = X.utils.aoa_to_sheet(aoa, { cellDates: true });
      var plage = X.utils.decode_range(ws['!ref']);
      for (var R = 1; R <= plage.e.r; R++) for (var Cc = 0; Cc <= plage.e.c; Cc++) {
        var cel = ws[X.utils.encode_cell({ r: R, c: Cc })];
        if (!cel) continue;
        if (cel.t === 'n') cel.z = '#,##0.00 "€"';
        if (cel.t === 'd') cel.z = 'dd/mm/yyyy';
      }
      ws['!cols'] = fe[1].map(function (h, i) { var w = h.length; fe[2].forEach(function (l) { var v = l[i]; w = Math.max(w, v instanceof Date ? 10 : typeof v === 'number' ? 12 : String(v).length); }); return { wch: Math.min(40, w + 2) }; });
      if (fe[2].length) ws['!autofilter'] = { ref: X.utils.encode_range({ s: { r: 0, c: 0 }, e: { r: fe[2].length, c: fe[1].length - 1 } }) };
      X.utils.book_append_sheet(wb, ws, t(fe[0]).slice(0, 31));
    });
    return X.write(wb, { bookType: 'xlsx', type: 'array', cellDates: true });

  // Graphique : Avancé et Remboursé sur une même échelle partant de 0 ; mois/trimestre en colonnes, résident/activité en barres.
  function maxRond(v) {

    var legende = '<div class="legende"><span><i class="pastille g-avance"></i>' + esc(t('graphique.avance')) + '</span><span><i class="pastille g-rembourse"></i>' + esc(t('graphique.rembourse')) + '</span></div>';

      depenses: e.depenses.filter(function (d) { return d.creePar === auteur0; }).map(function (d) { return Object.assign({}, d, { statut: L.statutDepense(e, d.id) }); }) };
  }
  var TUTO_ADMIN = [
    { g: 'tuto.groupe.quotidien', ecran: function () { placer('accueil'); }, cible: '#contenu > section.box', cle: 'g.tuto.admin_totaux' },
    { g: 'g.tuto.groupe.repartir', ecran: function () { placer('accueil'); }, cible: '#contenu [data-a="repartir"]', cle: 'g.tuto.a_repartir' },
    { g: 'g.tuto.groupe.repartir', ecran: function () { placer('repartir', { id: 'D4' }); }, cible: '#contenu .ligne-part', cle: 'g.tuto.cocher' },
    { g: 'g.tuto.groupe.repartir', ecran: function () { placer('repartir', { id: 'D4' }); }, cible: '[data-a="parts-egales"]', cle: 'g.tuto.parts' },
    { g: 'g.tuto.groupe.suivi', ecran: function () { placer('residents'); }, cible: '#contenu section.box .rangee', cle: 'tuto.residents' },
    { g: 'g.tuto.groupe.suivi', ecran: function () { placer('fiche', { id: 'r03' }); }, cible: '.actions [data-a="rembourser"]', cle: 'g.tuto.rembourser' },
    { g: 'tuto.groupe.totaux', ecran: function () { placer('totaux'); }, cible: '#contenu .segments', cle: 'tuto.regrouper' },
    { g: 'tuto.groupe.totaux', ecran: function () { placer('totaux'); }, cible: '[data-a="filtres"]', cle: 'tuto.filtres' },
    { g: 'tuto.groupe.totaux', ecran: function () { placer('totaux'); }, cible: '[data-a="basculer-graphique"]', cle: 'tuto.graphique' },
    { g: 'tuto.groupe.totaux', ecran: function () { placer('totaux'); }, cible: '#contenu [data-a="telecharger"]', cle: 'tuto.telecharger' },
    { g: 'g.tuto.groupe.gerer', ecran: function () { placer('depenses', { vue: 'activites' }); }, cible: '[data-a="vue-depenses"][data-v="activites"]', cle: 'g.tuto.activites' },
    { g: 'g.tuto.groupe.gerer', ecran: function () { placer('gestion'); }, cible: '.actions [data-a="nouveau-membre"]', cle: 'g.tuto.inviter' },
    { g: 'g.tuto.groupe.gerer', ecran: function () { placer('compte'); }, cible: '.entete [data-a="compte"]', cle: 'g.tuto.compte' },
    { g: 'tuto.groupe.fin', ecran: function () { placer('accueil'); }, cible: '.entete [data-a="aide"]', cle: 'g.tuto.revoir' }
  ];
  var TUTO_ASSO = [
    { g: 'g.tuto.groupe.saisir', ecran: function () { placer('accueil'); }, cible: '#contenu section.box', cle: 'g.tuto.asso_liste' },
    { g: 'g.tuto.groupe.saisir', ecran: function () { placer('accueil'); }, cible: '.actions [data-a="saisir"]', cle: 'g.tuto.asso_saisir' },
    { g: 'g.tuto.groupe.saisir', ecran: function () { placer('saisie'); }, cible: '#f-activite', cle: 'g.tuto.asso_activite' },
    { g: 'g.tuto.groupe.saisir', ecran: function () { placer('saisie', {}, { init: true, activiteId: 'danse', montant: '60,00', date: JOUR_JEU, commentaire: '', nomActivite: '' }); }, cible: '.actions [data-a="envoyer"]', cle: 'g.tuto.asso_envoyer' },
    { g: 'tuto.groupe.fin', ecran: function () { placer('compte'); }, cible: '.entete [data-a="compte"]', cle: 'g.tuto.compte' },
    { g: 'tuto.groupe.fin', ecran: function () { placer('accueil'); }, cible: '.entete [data-a="aide"]', cle: 'g.tuto.revoir' }
  ];
  function lancerTuto() {
    if (S.etape !== 'appli' || S.envoi) return;
    S.tutoAvant = { donnees: S.donnees, jour: S.jour, annee: S.annee, filtres: S.filtres, ecran: S.ecran, p: S.p, pile: S.pile, form: S.form };
    S.donnees = jeuTuto(); S.jour = JOUR_JEU; S.annee = +JOUR_JEU.slice(0, 4); S.filtres = { residentId: '', activiteId: '', periode: '' };
    S.notif = null; S.tuto = { i: 0, etapes: admin() ? TUTO_ADMIN : TUTO_ASSO };
    S.tuto.etapes[0].ecran(); render();
  }
  function allerTuto(i) {
    if (i < 0) return;
    if (i >= S.tuto.etapes.length) return finirTuto();
    S.tuto.i = i; S.tuto.etapes[i].ecran(); render();
  }
  function finirTuto() {
    var a = S.tutoAvant || {};
    S.tuto = null; marquerTutoVu();
    S.donnees = a.donnees; S.jour = a.jour; S.annee = a.annee; S.filtres = a.filtres;
    S.ecran = 'accueil'; S.p = {}; S.pile = []; S.form = {}; S.erreurs = [];
    render();
  }
  // Après chaque rendu : anneau sur la cible, voile autour, bulle au-dessus ou au-dessous.
  function dessinerTuto() {
    var etapes = S.tuto.etapes, etape = etapes[S.tuto.i], cible = app.querySelector(etape.cible), boite = app.getBoundingClientRect();
    var voile = document.createElement('div'); voile.className = 'tuto'; voile.setAttribute('role', 'dialog'); voile.setAttribute('aria-modal', 'true');
    voile.setAttribute('aria-labelledby', 'tuto-titre');
    var r = cible ? cible.getBoundingClientRect() : null;
    var anneau = r ? '<div class="tuto-anneau" style="left:' + (r.left - boite.left - 4) + 'px;top:' + (r.top - boite.top - 4) + 'px;width:' + (r.width + 8) + 'px;height:' + (r.height + 8) + 'px"></div>' : '<div class="tuto-anneau tuto-plein"></div>';
    var n = S.tuto.i + 1, dernier = n === etapes.length;
    voile.innerHTML = anneau + '<div class="tuto-bulle">' +
      '<div class="tuto-etape"><span>' + esc(t(etape.g)) + '</span><span class="num">' + esc(t('tuto.compte', { n: n, total: etapes.length })) + '</span></div>' +
      '<p class="tuto-titre" id="tuto-titre">' + esc(t(etape.cle + '.titre')) + '</p>' +
      '<p class="tuto-texte">' + esc(t(etape.cle + '.texte')) + '</p>' +
      '<div class="tuto-actions">' + (dernier ? '' : '<button type="button" class="btn" data-a="tuto-passer">' + esc(t('tuto.passer')) + '</button>') +
      '<button type="button" class="btn icone" data-a="tuto-prec" aria-label="' + esc(t('tuto.precedent')) + '"' + (n === 1 ? ' disabled' : '') + '>' + ic('gauche') + '</button>' +
      '<button type="button" class="btn principal" data-a="tuto-suiv" id="tuto-suiv">' + esc(t(dernier ? 'tuto.terminer' : 'tuto.suivant')) + '</button></div></div>';
    app.appendChild(voile);
    var bulle = voile.querySelector('.tuto-bulle'), hb = bulle.offsetHeight, H = boite.height, marge = 12, top;
    if (r) {
      var bas = r.bottom - boite.top + 4 + marge, haut = r.top - boite.top - 4 - marge - hb;
      top = bas + hb <= H - marge ? bas : haut >= marge ? haut : Math.max(marge, H - hb - marge);
    } else top = (H - hb) / 2;
    bulle.style.top = top + 'px';
    var suiv = document.getElementById('tuto-suiv'); if (suiv) suiv.focus({ preventScroll: true });
  }

  /* ---------- Pages à la hauteur de l'écran ----------
   * Après le rendu : s'il reste de la place sous la liste, on ajoute des lignes par page ; si elle déborde, on en
   * retire. Calculé une fois par écran (et à chaque changement de taille), jamais plus de deux redessins. */
  var LIGNES = '.ligne-depense, #contenu .rangee:not(.box-titre .rangee), .ligne-part, .tableau .ligne:not(.entete-t):not(.pied):not(.g-detail), .g-ligne';
  var ajustements = 0;
  function ajusterPages() {
    if (S.etape !== 'appli' || S.p.graphique) { ajustements = 0; return; }
    var c = document.getElementById('contenu');
    if (!c || !c.lastElementChild) return;
    var toutes = Array.prototype.slice.call(c.querySelectorAll(LIGNES)).filter(function (el) { return !el.closest('.box-titre'); });
    // La liste paginée : le plus grand groupe de lignes sœurs.
    var groupes = [], lignes = [];
    toutes.forEach(function (el) { var g = groupes.filter(function (x) { return x.p === el.parentNode; })[0]; if (!g) groupes.push(g = { p: el.parentNode, l: [] }); g.l.push(el); });
    groupes.forEach(function (g) { if (g.l.length > lignes.length) lignes = g.l; });
    if (!lignes.length || !S.parPageVu) { ajustements = 0; return; }
    var h = 0; lignes.forEach(function (el) { h = Math.max(h, el.getBoundingClientRect().height); });
    var bas = c.getBoundingClientRect().bottom - parseFloat(getComputedStyle(c).paddingBottom || 0);
    var libre = bas - c.lastElementChild.getBoundingClientRect().bottom;
    var cle = cleCapacite(), n = S.parPageVu, pager = !!c.querySelector('.pager');
    var pleine = lignes.length >= n;   // page incomplète (la dernière) : on ne grandit pas
    var cible = libre < -1 ? Math.max(1, n - Math.ceil(-libre / h)) : pager && pleine && libre >= h ? n + Math.floor(libre / h) : n;
    if (cible === n || ajustements >= 2) { ajustements = 0; return; }
    ajustements++; S.cap[cle] = cible; S.p.page = 0; render();
  }
  var tailleTimer;
  window.addEventListener('resize', function () { clearTimeout(tailleTimer); tailleTimer = setTimeout(function () { S.cap = {}; render(); }, 200); });

  /* ---------- Envoi d'une dépense ---------- */
  function envoyer() {
    if (S.envoi) return;
    var f = S.form, montant = L.lireMontant(f.montant), erreurs = [];
    if (!f.activiteId) erreurs.push('erreur.activite_requise');
    if (f.activiteId === '__nouvelle' && !(f.nomActivite || '').trim()) erreurs.push('erreur.nom_requis');
    if (erreurs.length) { S.erreurs = erreurs; render(); return; }
    var v = L.validerDepense({ activites: f.activiteId === '__nouvelle' ? [{ id: '__nouvelle', nom: 'x', actif: true }] : S.donnees.activites, depenses: [], parts: [] },
      { activiteId: f.activiteId, montant: montant, date: f.date, commentaire: f.commentaire }, S.jour);
    if (v.erreurs.length) { S.erreurs = v.erreurs; render(); return; }
    // Affichage immédiat : la dépense entre dans la liste avec « Envoi… » ; la réponse du service la remplace
    // (avec les données à jour) ou la retire et rouvre le formulaire tel qu'il était.
    var nouvelle = f.activiteId === '__nouvelle';
    var envoi = { id: '__envoi', activiteId: nouvelle ? '' : f.activiteId, nomActivite: nouvelle ? f.nomActivite.trim() : '', montant: montant, date: f.date,
      commentaire: (f.commentaire || '').trim(), creePar: S.moi && S.moi.email, creeLe: '9999', statut: 'envoi' };
    var formGarde = f, pileGardee = S.pile.slice();
    S.envoi = true; S.erreurs = []; S.form = {};
    retour();
    S.donnees.depenses = (S.donnees.depenses || []).concat([envoi]); render();
    var corps = { montant: montant, date: f.date, commentaire: f.commentaire };
    if (nouvelle) corps.nouvelleActivite = f.nomActivite.trim(); else corps.activiteId = f.activiteId;
    function annuler() {
      S.donnees.depenses = S.donnees.depenses.filter(function (d) { return d !== envoi; });
      S.pile = pileGardee; S.pile.push({ ecran: S.ecran, p: S.p }); S.ecran = 'saisie'; S.p = {}; S.form = formGarde; S.envoi = false;
    }
    api('ajouterDepense', corps).then(function (r) {
      if (!r.ok) { annuler(); return refus(r); }
      S.envoi = false;
      if (r.vue && r.vue.ok) appliquerVue(r.vue); else envoi.statut = r.depense.statut;
      notifier('g.depense.ok', 'ok', { montant: fmt(montant) });
      render();
    }).catch(function () { annuler(); echecReseau(); });
  }

  var ACTIONS = {
    saisir: function () { aller('saisie'); },
    retour: function () { if (S.ecran === 'telecharger' && S.p.choixRecu) { S.p.choixRecu = null; S.p.page = 0; render(); } else retour(); },
    onglet: function (d) { onglet(d.e); },
    envoyer: envoyer,
    page: function (d) { S.p[d.cle] = Math.max(0, (S.p[d.cle] || 0) + (+d.d)); render(); },
    deconnexion: seDeconnecter,
    reessayer: function () { if (S.jeton) charger(); else { S.etape = 'connexion'; render(); } },
    'fermer-notif': function () { S.notif = null; render(); },
    // Admin
    repartir: function (d) { aller('repartir', { id: d.id }); },
    'vue-depenses': function (d) { S.p = { vue: d.v }; render(); },
    'modifier-depense': function (d) { aller('form-depense', { id: d.id }); },
    'enregistrer-depense': enregistrerDepense,
    'supprimer-depense': supprimerDepense,
    'annuler-repartition': annulerRepartition,
    'nouvelle-activite': function () { aller('form-activite', {}); },
    'modifier-activite': function (d) { aller('form-activite', { id: d.id }); },
    'enregistrer-activite': enregistrerActivite,
    exporter: exporter,
    compte: function () { if (S.ecran !== 'compte') aller('compte'); },
    theme: function (d) { try { localStorage.setItem(CLE_THEME, d.v); } catch (x) { /* thème pour cette visite */ } appliquerTheme(d.v); render(); },
    'deconnexion-demande': function () { if (!S.p.confirmer) { S.p.confirmer = true; render(); } else seDeconnecter(); },
    aide: lancerTuto,
    'tuto-suiv': function () { allerTuto(S.tuto.i + 1); },
    'tuto-prec': function () { allerTuto(S.tuto.i - 1); },
    'tuto-passer': finirTuto,
    'nouveau-membre': function () { aller('form-membre', {}); },
    'modifier-membre': function (d) { aller('form-membre', { email: d.email }); },
    'role-membre': function (d) { S.form.role = d.v; render(); },
    'basculer-notifier': function () { S.form.notifier = !S.form.notifier; render(); },
    'enregistrer-membre': enregistrerMembre,
    'renvoyer-invitation': renvoyerInvitation,
    'vue-totaux': function (d) { S.p = { vue: d.v, graphique: S.p.graphique }; S.vueTotaux = d.v; render(); },
    'basculer-graphique': function () { S.p.graphique = !S.p.graphique; S.p.page = 0; S.p.sel = 0; render(); },
    'graph-sel': function (d) { S.p.sel = +d.k; render(); },
    'graph-pas': function (d) { S.p.sel = Math.max(0, (S.p.sel || 0) + (+d.d)); render(); },
    'aide-totaux': function () { S.p.aide = !S.p.aide; render(); },
    filtres: function () { aller('filtres'); },
    annee: function (d) { var ans = L.annees(etatCalcul(), S.jour), i = ans.indexOf(S.annee) + (+d.d); if (ans[i]) { S.annee = ans[i]; render(); } },
    tri: function (d) { S.tri = d.v; render(); },
    'effacer-filtres': function () { S.filtres = { residentId: '', activiteId: '', periode: '' }; render(); },
    telecharger: function (d) { aller('telecharger', d.id ? { id: d.id } : {}); },
    tele: function (d) { telecharger(d.q, d.f, d.id); },
    'basculer-part': function (d) {
      var f = S.form;
      if (f.parts[d.id] !== undefined) delete f.parts[d.id]; else f.parts[d.id] = '';
      if (!f.manuel) egaliser();
      S.erreurs = []; render();
      var champ = document.getElementById('part-' + d.id);
      if (champ && f.manuel) champ.focus();
    },
    'parts-egales': function () { egaliser(); S.erreurs = []; render(); },
    'valider-repartition': validerRepartition,
    'voir-retards': function () { onglet('residents'); S.p.retard = true; render(); },
    'filtre-retard': function () { S.p.retard = !S.p.retard; S.p.page = 0; render(); },
    fiche: function (d) { aller('fiche', { id: d.id }); },
    'nouveau-resident': function () { aller('form-resident', {}); },
    'modifier-resident': function (d) { aller('form-resident', { id: d.id }); },
    'basculer-actif': function () { S.form.actif = !S.form.actif; render(); },
    'enregistrer-resident': enregistrerResident,
    'supprimer-resident': supprimerResident,
    rembourser: function (d) { aller('form-remb', { id: d.id }); },
    'valider-remb': validerRemb,
    'voir-remb': function (d) { aller('remb', { id: d.id }); },
    'supprimer-remb': supprimerRemb
  };
  app.addEventListener('click', function (ev) {
    var el = ev.target.closest('[data-a]');
    if (!el || el.disabled) return;
    if (S.tuto && el.getAttribute('data-a').indexOf('tuto-') !== 0) { ev.preventDefault(); return; }   // pendant le tutoriel : seulement ses boutons
    var f = ACTIONS[el.getAttribute('data-a')];
    if (f) { ev.preventDefault(); f(el.dataset); }
  });
  app.addEventListener('input', function (ev) {
    var el = ev.target;
    // Part d'un résident : saisie à la main → parts ajustées ; le total se met à jour sans redessiner.
    var part = el.getAttribute && el.getAttribute('data-part');
    if (part) {
      S.form.parts[part] = el.value; S.form.manuel = true;
      var d = idx(S.donnees.depenses)[S.p.id], somme = document.getElementById('somme-parts');
      if (somme && d) somme.innerHTML = sommeParts(d);
      var egal = document.querySelector('[data-a="parts-egales"]'); if (egal) egal.removeAttribute('aria-pressed');
      if (S.erreurs.length) { S.erreurs = []; render(); }
      return;
    }
    var k = el.getAttribute && el.getAttribute('data-champ');
    if (!k) return;
    if (k === 'q') {   // recherche : retour en page 1, redessin immédiat
      if (el.getAttribute('data-p')) S.p.q = el.value; else S.form.q = el.value;
      S.p.page = 0; render(); return;
    }
    S.form[k] = el.value;
    if (S.erreurs.length) { S.erreurs = []; render(); }
  });
  app.addEventListener('change', function (ev) {
    var fk = ev.target.getAttribute && ev.target.getAttribute('data-filtre');
    if (fk) { S.filtres[fk] = ev.target.value; render(); return; }
    var k = ev.target.getAttribute && ev.target.getAttribute('data-champ');
    if (k && k !== 'q') { S.form[k] = ev.target.value; if (k === 'activiteId' || k === 'partId') render(); }
  });
  app.addEventListener('submit', function (ev) { ev.preventDefault(); if (S.ecran === 'saisie' && !S.tuto) envoyer(); });
  document.addEventListener('keydown', function (ev) { if (S.tuto && ev.key === 'Escape') { ev.preventDefault(); finirTuto(); } });

  // Démarrage : avec une session gardée, les données se chargent tout de suite ; sinon attendre la bibliothèque
  // de connexion Google (chargée en async), 10 s au plus.
  S.session = lireSession();
  appliquerTheme(lireTheme());
  render();
  if (S.session) charger();
  var essais = 0;
  (function attendre() {
    if (window.google && google.accounts && google.accounts.id) {
      if (S.etape === 'demarrage') { S.etape = 'connexion'; render(); demanderConnexion(); } else initGis();
      return;
    }
    if (++essais > 100) { if (S.etape === 'demarrage') { S.etape = 'indispo'; render(); } return; }
    setTimeout(attendre, 100);
  })();
})();

</script>
